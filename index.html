<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粵語朗讀評分</title>
<!-- Transformers.js for on-device Whisper ASR (lazy loaded) -->
<script type="module">
  // Just expose the CDN URL as a hint. Actual dynamic import happens on first use.
  window.TRANSFORMERS_CDN = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5';
</script>
<style>
:root { --purple:#7c3aed; --gold:#f59e0b; --green:#22c55e; --red:#ef4444; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Microsoft JhengHei',sans-serif; background:#1a1a2e; color:#fff; font-size:18px; min-height:100vh; }
.page { display:none; min-height:100vh; padding:20px; }
.page.active { display:block; }
.home-card, .hub-card, .vocab-card, .result-card { background:#fff; color:#1a1a2e; border:4px solid #f59e0b; border-radius:24px; padding:24px; margin:20px auto; max-width:700px; }
h1,h2 { font-size:2.2em; color:#f59e0b; text-align:center; margin-bottom:20px; }
input, button { font-size:1.4em; padding:18px 32px; border-radius:16px; border:none; min-height:70px; }
button { background:#7c3aed; color:#fff; cursor:pointer; touch-action:manipulation; }
button:active { transform:scale(0.95); }
.vocab-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; max-width:900px; margin:0 auto; }
.vocab-card { text-align:center; cursor:pointer; transition:transform .2s; }
.vocab-card:hover { transform:scale(1.03); }
.vocab-char { font-size:2.8em; font-weight:bold; color:#7c3aed; }
.vocab-pinyin { color:#666; margin:8px 0; }
.record-btn { background:#22c55e; font-size:1.6em; width:100%; margin-top:16px; }
.score { font-size:2.5em; font-weight:bold; color:#22c55e; }
.hub-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:800px; margin:0 auto; }
.hub-card { background:rgba(255,255,255,0.1); border:3px solid rgba(255,255,255,0.3); color:#fff; text-align:center; cursor:pointer; }
.hub-icon { font-size:3em; margin-bottom:12px; }
.progress { position:fixed; top:0; left:0; width:100%; background:#111; padding:8px; z-index:100; }
.progress-dots { display:flex; justify-content:center; gap:12px; }
.progress-dot { width:28px; height:28px; border-radius:50%; background:#444; display:flex; align-items:center; justify-content:center; font-size:0.9em; }
.progress-dot.done { background:#22c55e; }
.progress-dot.current { background:#f59e0b; animation:pulse 1.5s infinite; }
@keyframes pulse { 50%{transform:scale(1.2);} }
#toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:14px 28px; border-radius:12px; z-index:9999; display:none; pointer-events:none; }
.pin-slot { display:inline-flex;align-items:center;justify-content:center;width:48px;height:60px;background:#fff;color:#1a1a2e;font-size:2.2em;font-weight:bold;border-radius:12px;border:3px solid #f59e0b; }
.pin-slot.filled { background:#f59e0b;color:#fff; }
.pin-btn { background:#7c3aed;color:#fff;font-size:2em;padding:0;min-height:80px;border-radius:16px;cursor:pointer;touch-action:manipulation; }
.pin-btn:active { transform:scale(0.95); }
.student-avatar-card { background:#fff;color:#1a1a2e;border:4px solid #f59e0b;border-radius:20px;padding:16px;cursor:pointer;text-align:center;transition:transform .2s;touch-action:manipulation; }
.student-avatar-card:hover { transform:scale(1.05); }
.student-avatar-card:active { transform:scale(0.95); }
.student-emoji { font-size:3em;display:block;margin-bottom:6px; }
</style>
</head>
<body>
<div class="progress"><div class="progress-dots" id="progressDots"></div></div>

<!-- HOME / LOGIN -->
<div id="home" class="page active">
  <div class="home-card" style="text-align:center;margin-top:60px;">
    <h1>粵語朗讀評分</h1>
    <p style="font-size:1.2em;margin:10px 0 20px;">即時 AI 發音評估</p>

    <!-- 登入模式：PIN -->
    <div id="loginPinMode">
      <p style="font-size:1.1em;margin:20px 0 10px;">輸入你嘅 5 位數字密碼</p>
      <div id="pinDisplay" style="display:flex;justify-content:center;gap:10px;margin:20px 0;">
        <span class="pin-slot">·</span><span class="pin-slot">·</span><span class="pin-slot">·</span><span class="pin-slot">·</span><span class="pin-slot">·</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:20px auto;">
        <button class="pin-btn" onclick="pinPress('1')">1</button>
        <button class="pin-btn" onclick="pinPress('2')">2</button>
        <button class="pin-btn" onclick="pinPress('3')">3</button>
        <button class="pin-btn" onclick="pinPress('4')">4</button>
        <button class="pin-btn" onclick="pinPress('5')">5</button>
        <button class="pin-btn" onclick="pinPress('6')">6</button>
        <button class="pin-btn" onclick="pinPress('7')">7</button>
        <button class="pin-btn" onclick="pinPress('8')">8</button>
        <button class="pin-btn" onclick="pinPress('9')">9</button>
        <button onclick="pinClear()" style="background:#666;min-height:80px;font-size:1.3em;border-radius:16px;">清除</button>
        <button class="pin-btn" onclick="pinPress('0')">0</button>
        <button onclick="pinBackspace()" style="background:#666;min-height:80px;font-size:1.3em;border-radius:16px;">⌫</button>
      </div>
      <div id="loginError" style="color:#ef4444;font-size:1.1em;min-height:24px;margin-top:10px;"></div>
    </div>

    <!-- 登入模式：Grid (名+emoji) -->
    <div id="loginGridMode" style="display:none;">

      <div id="studentGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:500px;margin:20px auto;"></div>

    <div class="hub-grid">
      <div class="hub-card" onclick="goTo('vocab');initVocab();">
        <div class="hub-icon">📚</div>
        <div style="font-size:1.5em;font-weight:bold;">詞彙學習</div>
        <div style="opacity:0.8;">聽發音 + 朗讀練習</div>

      </div>
      <div class="hub-card" onclick="goTo('assessment');startAssessment();">
        <div class="hub-icon">🎤</div>
        <div style="font-size:1.5em;font-weight:bold;">即時評估</div>
        <div style="opacity:0.8;">錄音 + AI 評分</div>
        <div id="hubAssessment" style="margin-top:12px;"></div>
      </div>
      <div class="hub-card" onclick="showMyProgress();">
        <div class="hub-icon">⭐</div>
        <div style="font-size:1.5em;font-weight:bold;">我的進度</div>

<script>
// STATE
let state = {
  mode: 'student',  // 'student' | 'teacher'
  currentStudentId: null,
  currentWord: null,
  score: 0,
  completed: { vocab: false, assessment: false },
  autoTTS: true,
  categories: [],
  words: [],
  assessmentIndex: 0,
  assessmentScores: [],
  selectedCategoryIds: [],
  // Students + progress (loaded from localStorage at init)
  students: [],
  progress: {},       // { [studentId]: progressObj }
  loginMode: 'pin',   // 'pin' | 'grid' | 'both'
  // ASR engine selection (pluggable)
  asrEngine: 'webspeech'  // 'webspeech' | 'whisper' | 'custom'
};

// ================== ASR ENGINE LAYER ==================
// Each engine implements: { id, name, transcribe(audioBlob?) → Promise<{text, confidence, raw}>, isAvailable() }
// Score is computed uniformly after transcribe (Levenshtein-based) — no per-engine scoring.
const _ASR_ENGINES = {
  webspeech: {
    id: 'webspeech',
    name: 'Web Speech API',
    description: '瀏覽器內建，廣東話支援較弱',
    costEmoji: '🆓',
    privacyEmoji: '🔓',
    isAvailable() { return 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window; },
    transcribe() { return new Promise((resolve, reject) => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const r = new SR();
      r.lang = 'zh-HK';
      r.continuous = false;
      r.interimResults = false;
      r.onresult = (ev) => resolve({
        text: ev.results[0][0].transcript.trim(),
        confidence: ev.results[0][0].confidence || 0.5,
        raw: ev.results[0][0]
      });
      r.onerror = (ev) => reject(new Error('Speech error: ' + ev.error));
      try { r.start(); } catch(e) { reject(e); }
    }); }
  },
  whisper: {
    id: 'whisper',
    name: 'Whisper 本地（離線）',
    description: 'iPad 內建模型，私隱零風險',
    costEmoji: '🆓',
    privacyEmoji: '🔒',
    isAvailable() {
      // Check for WebAssembly + Float32Array (needed by transformers.js)
      return typeof WebAssembly !== 'undefined' && typeof Worker !== 'undefined';
    },
    _pipeline: null,
    _pipelineLoading: null,
    async _ensurePipeline(onProgress) {
      if (this._pipeline) return this._pipeline;
      if (this._pipelineLoading) return this._pipelineLoading;
      this._pipelineLoading = (async () => {
        if (onProgress) onProgress({ stage: 'cdn-load', message: '⏳ 載入 Transformers.js…' });
        // Dynamic import — only loaded when first needed
        const lib = await import(window.TRANSFORMERS_CDN);
        if (onProgress) onProgress({ stage: 'model-load', message: '⏳ 下載 Whisper 模型（約 40MB，只需一次）…' });
        const pipe = await lib.pipeline(
          'automatic-speech-recognition',
          'Xenova/whisper-tiny',
          {
            // q8 量化 — 適合 WASM
            dtype: 'q8',
            // Use WebGPU if available for speed; else fall back to WASM
            device: typeof navigator !== 'undefined' && navigator.gpu ? 'webgpu' : 'wasm'
          }
        );
        this._pipeline = pipe;
        return pipe;
      })();
      return this._pipelineLoading;
    },
    async transcribe(audioBlob, onProgress) {
      try {
        const pipe = await this._ensurePipeline(onProgress);
        if (onProgress) onProgress({ stage: 'preprocess', message: '⏳ 處理音訊…' });
        // Convert audioBlob to 16kHz mono Float32Array
        const audio = await _blobToFloat32(audioBlob);
        if (onProgress) onProgress({ stage: 'transcribe', message: '⏳ Whisper 識別中…' });
        // Cantonese: whisper doesn't have 'cantonese' code, but 'zh' works
        // (model is multilingual). Add language hint to bias toward Chinese.
        const result = await pipe(audio, {
          language: 'chinese',  // closer to Cantonese than 'zh'
          task: 'transcribe',
          // Chunked for long audio (we send ~4s, so this is safe)
          chunk_length_s: 30,
          stride_length_s: 5
        });
        const text = (result && result.text) ? result.text.trim() : '';
        return {
          text,
          confidence: 1,  // transformers.js doesn't expose confidence reliably
          raw: result
        };
      } catch (e) {
        console.error('Whisper transcribe error:', e);
        return { text: '', confidence: 0, raw: { error: e.message, engineId: 'whisper' } };
      }
    }
  },
  custom: {
    id: 'custom',

    costEmoji: '🆓',

    isAvailable() { return typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined'; },
    transcribe(audioBlob, onProgress) {

      return new Promise((resolve) => {

  }
};

const _AVATAR_EMOJIS = ['🌟','🐯','🐻','🦁','🐼','🐨','🐸','🐵','🦊','🐰','🐱','🐶','🦄','🐙','🐢','🦋','🌸','🌈','🍎','🍇','⚽','🎨','🎵','🚀'];

// ================== AUDIO PREPROCESSING ==================
// Convert any audio Blob (webm/ogg/wav) → 16kHz mono Float32Array (what Whisper expects)
async function _blobToFloat32(blob) {
  const arrayBuffer = await blob.arrayBuffer();
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioCtx();
  try {
    // decodeAudioData works for webm/ogg/wav/mp4 in modern browsers
    const decoded = await audioCtx.decodeAudioData(arrayBuffer);
    // Resample to 16kHz mono
    const targetSampleRate = 16000;
    const numSamples = Math.ceil(decoded.duration * targetSampleRate);
    const offlineCtx = new OfflineAudioContext(1, numSamples, targetSampleRate);
    const source = offlineCtx.createBufferSource();
    source.buffer = decoded;
    source.connect(offlineCtx.destination);
    source.start(0);
    const rendered = await offlineCtx.startRendering();
    return rendered.getChannelData(0);  // Float32Array
  } finally {
    audioCtx.close();
  }
}

let recognition;
let _currentAudioBlob = null;

function startRecording() {
  const status = document.getElementById('recordingStatus');
  const engine = _ASR_ENGINES[state.asrEngine] || _ASR_ENGINES.webspeech;

  if (!engine.isAvailable()) {
    status.innerHTML = '❌ 此裝置唔支援 ' + engine.name;
    return;
  }

  status.innerHTML = '🔴 錄音中… 請大聲朗讀詞彙';

  // For non-WebSpeech engines, we use MediaRecorder to capture audio blob
  if (engine.id === 'webspeech') {
    if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
      status.innerHTML = '❌ 請用 Chrome（Safari 支援有限）';
      return;
    }
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRec();
    recognition.lang = 'zh-HK';
    recognition.continuous = false;
    recognition.interimResults = false;

    try { recognition.start(); } catch (e) {
      console.error(e);
      status.innerHTML = '❌ 無法啟動錄音，請檢查權限';
      return;
    }

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.trim();
      status.innerHTML = `你講咗：${transcript}`;
      scorePronunciation(transcript);
    };
    recognition.onerror = (event) => {
      console.error('Speech error:', event.error);
      let msg = '❌ 錄音出錯';
      if (event.error === 'not-allowed') msg = '❌ 請允許麥克風權限';
      else if (event.error === 'network') msg = '❌ 需要網絡連接';
      else if (event.error === 'no-speech') msg = '❌ 冇聽到聲音，請大聲啲';
      else if (event.error === 'audio-capture') msg = '❌ 麥克風問題，請檢查';
      else if (event.error === 'service-not-allowed') msg = '❌ 瀏覽器不支援，請用 Chrome';
      else if (event.error === 'aborted') msg = '❌ 已取消，請再試';
      else msg = '❌ 請大聲啲或換個安靜地方';
      status.innerHTML = msg + '，請再試';
    };
    recognition.onend = () => {
      if (status.innerHTML.includes('錄音中')) status.innerHTML = '錄音結束';
    };
  } else {
    // Whisper / Custom: use MediaRecorder to capture audio blob
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status.innerHTML = '❌ 此瀏覽器不支援錄音';
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      const recorder = new MediaRecorder(stream);
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: 'audio/webm' });
        _currentAudioBlob = blob;
        try {
          const result = await engine.transcribe(blob, (progress) => {
            status.innerHTML = '⏳ ' + (progress.message || '處理中…');
          });
          // If engine returned text, score it. If empty (mock/whisper not implemented), fall back.
          if (result.text) {
            status.innerHTML = `你講咗：${result.text}`;
            scorePronunciation(result.text, { engine: engine.id, audioBlob: blob, raw: result.raw });
          } else {
            // Engine returned no text (e.g. whisper local not yet implemented, or custom mode)
            // For custom engine: do self-compare scoring
            if (engine.id === 'custom') {
              status.innerHTML = '🎤 自訂模式：分析聲音特徵中…';
              const customScore = await _customScoreAudio(blob, state.currentWord);
              scorePronunciation('', { engine: 'custom', customScore, audioBlob: blob });
            } else {
              // whisper mock: ask student to type
              status.innerHTML = `⚠️ ${engine.name} 暫未實裝本地模型。請用 Web Speech 或輸入你讀嘅字：`;
              _promptManualInput(status, state.currentWord);
            }
          }
        } catch (e) {
          console.error(e);
          status.innerHTML = '❌ 引擎錯誤：' + e.message;
        }
      };
      recorder.start();
      // Auto-stop after 4 seconds (typical for a short word)
      setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 4000);
    }).catch(err => {
      status.innerHTML = '❌ 麥克風權限被拒：' + err.message;
    });
  }
}

function _promptManualInput(status, word) {
  // Fallback: ask student what they said (text input)
  const txt = prompt(`你讀咗「${word.char}」（讀音：${word.pinyin}）。輸入你讀咗嘅字（粵語/普通話皆可）：`);
  if (txt === null) {
    status.innerHTML = '已取消';
    return;
  }
  status.innerHTML = `你講咗：${txt}`;
  scorePronunciation(txt, { engine: 'manual' });
}

// Custom engine: extract audio features + compare to a baseline
async function _customScoreAudio(audioBlob, word) {
  try {
    const arrayBuffer = await audioBlob.arrayBuffer();
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    const decoded = await audioCtx.decodeAudioData(arrayBuffer);
    audioCtx.close();

    // Features: duration, energy (RMS), zero-crossing rate, peak amplitude
    const channel = decoded.getChannelData(0);
    const duration = decoded.duration;
    let sumSq = 0, peak = 0, zcr = 0;
    for (let i = 0; i < channel.length; i++) {
      const v = channel[i];
      sumSq += v * v;
      if (Math.abs(v) > peak) peak = Math.abs(v);
      if (i > 0 && Math.sign(channel[i-1]) !== Math.sign(v)) zcr++;
    }
    const rms = Math.sqrt(sumSq / channel.length);

    // Get baseline for this word (from previous attempts) or use defaults
    const baseline = _getAudioBaseline(word.char);
    const durationMatch = baseline.duration
      ? Math.max(0, 1 - Math.abs(duration - baseline.duration) / Math.max(duration, baseline.duration))
      : 0.7;
    const energyMatch = baseline.rms
      ? Math.max(0, 1 - Math.abs(rms - baseline.rms) / Math.max(rms, baseline.rms, 0.01))
      : 0.7;

    // Combine: 50% energy + 30% duration + 20% loudness
    const score = Math.round(
      Math.min(100, Math.max(0,
        energyMatch * 50 + durationMatch * 30 + (peak > 0.05 ? 20 : 5)
      ))
    );
    // Save as new baseline
    _updateAudioBaseline(word.char, { duration, rms, peak, zcr });
    return { score, duration, rms, peak, durationMatch, energyMatch };
  } catch (e) {
    console.warn('custom scoring failed', e);
    return { score: 60, error: e.message };
  }
}

function _getAudioBaseline(word) {
  try {
    const all = JSON.parse(localStorage.getItem('yueAudioBaselines') || '{}');
    return all[word] || {};
  } catch(e) { return {}; }
}

function _updateAudioBaseline(word, features) {
  try {
    const all = JSON.parse(localStorage.getItem('yueAudioBaselines') || '{}');
    const existing = all[word];
    if (existing) {
      // EMA blend with new measurement
      existing.duration = existing.duration * 0.7 + features.duration * 0.3;
      existing.rms = existing.rms * 0.7 + features.rms * 0.3;
      existing.peak = existing.peak * 0.7 + features.peak * 0.3;
      existing.samples = (existing.samples || 0) + 1;
    } else {
      all[word] = { ...features, samples: 1 };
    }
    localStorage.setItem('yueAudioBaselines', JSON.stringify(all));
  } catch(e) {}
}

function scorePronunciation(transcript, opts) {
  opts = opts || {};
  const w = state.currentWord;
  const target = w.target;
  let aiScore, feedback, scoringMethod;

  if (opts.engine === 'custom' && opts.customScore) {
    // Custom engine: use audio-feature score directly
    aiScore = opts.customScore.score;
    const dur = opts.customScore.duration ? opts.customScore.duration.toFixed(1) : '?';
    const energy = opts.customScore.rms ? Math.round(opts.customScore.rms * 100) : '?';
    feedback = aiScore >= 85
      ? `做得好！（${dur}秒, 能量${energy}）`
      : aiScore >= 55
      ? `唔錯！（${dur}秒, 能量${energy}）繼續努力～`
      : `再嚟多次！（${dur}秒 — 試下讀耐啲）`;
    scoringMethod = 'custom-audio';
  } else {
    // String-match scoring (WebSpeech / Whisper / manual)
    const clean = (s) => s.replace(/[，。！？、\s]/g, "").toLowerCase();
    const tClean = clean(target);
    const uClean = clean(transcript);
    const similarity = calculateSimilarity(uClean, tClean);
    const bonus = (uClean.includes(tClean) || tClean.includes(uClean)) ? 20 : 0;
    const targetChars = [...tClean];
    const userChars = [...uClean];
    const overlap = targetChars.filter(c => userChars.includes(c)).length;
    const overlapBonus = overlap * 18;
    const firstMatch = (targetChars[0] && userChars[0] && targetChars[0] === userChars[0]) ? 15 : 0;
    aiScore = Math.min(100, Math.floor(similarity * 50 + overlapBonus + firstMatch + bonus));
    feedback = aiScore >= 85 ? '做得好！發音好準！' : aiScore >= 55 ? '唔錯！繼續努力～' : '再試一次，你可以嘅！';
    scoringMethod = 'string-match';
  }

  state.assessmentScores.push({ word: w.char, score: aiScore, transcript, engine: opts.engine || state.asrEngine, method: scoringMethod });
  _recordAttempt(w.char, aiScore, transcript);
  state.score += aiScore;

  // show result
  document.getElementById('assessmentContent').innerHTML = '';
  goTo('result');
  document.getElementById('resultWord').textContent = w.char;
  document.getElementById('resultScore').textContent = aiScore + '/100';
  document.getElementById('resultFeedback').textContent = feedback;
  document.getElementById('resultAI').innerHTML = `AI 評分：${aiScore}分<br>你講：${transcript || '（自訂模式）'}<br>正確：${target}<br><span style="font-size:0.85em;color:#7c3aed;">引擎：${(opts.engine || state.asrEngine)}｜方法：${scoringMethod}</span>`;
  
  if (aiScore >= 80) {
    showConfetti(12);
  }
}

function calculateSimilarity(a, b) {
  if (a === b) return 1;
  const longer = a.length > b.length ? a : b;
  const shorter = a.length > b.length ? b : a;
  if (longer.length === 0) return 1;
  return (longer.length - editDistance(longer, shorter)) / longer.length;
}

function editDistance(a, b) {
  const dp = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[0][i] = i;
  for (let j = 0; j <= b.length; j++) dp[j][0] = j;
  for (let j = 1; j <= b.length; j++) {
    for (let i = 1; i <= a.length; i++) {
      dp[j][i] = Math.min(
        dp[j-1][i] + 1,
        dp[j][i-1] + 1,
        dp[j-1][i-1] + (a[i-1] === b[j-1] ? 0 : 1)
      );
    }
  }
  return dp[b.length][a.length];
}

  state.assessmentIndex++;
  goTo('assessment');

    renderFilteredAssessment();

function retryCurrentWord() {

  goTo('assessment');

// INIT — fetch JSON data then restore session state
async function init() {
  // Load categories
  try {
    const resp = await fetch('data/words.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    state.categories = data.categories || [];

    const savedCats = localStorage.getItem('yueCategories');
    if (savedCats) {
      try {
        const parsed = JSON.parse(savedCats);
        if (parsed && Array.isArray(parsed) && parsed.length > 0) {
          state.categories = parsed;
        }
      } catch(e) {}
    }

    const savedSettings = localStorage.getItem('yueAdminSettings');
    if (savedSettings) {
      try {
        const overrides = JSON.parse(savedSettings);
        state.categories.forEach(cat => {
          if (overrides[cat.id] !== undefined) cat.enabled = overrides[cat.id];
        });
      } catch(e) {}
    }
    _rebuildWords();
  } catch(e) {
    console.warn('無法載入 data/words.json', e);
    const savedCats = localStorage.getItem('yueCategories');
    if (savedCats) {
      try { state.categories = JSON.parse(savedCats); _rebuildWords(); } catch(e2) {}
    } else {
      state.categories = [];
      state.words = [];
    }
  }

  // Load students + progress
  try {
    const sData = JSON.parse(localStorage.getItem('yueStudents') || '{}');
    state.students = Array.isArray(sData.students) ? sData.students : [];
    if (sData.loginMode) state.loginMode = sData.loginMode;
  } catch(e) { state.students = []; }
  // Always re-seed a demo student if the list is empty
  // (handles: first run, teacher deleted all, cleared localStorage, v1.0→v1.1 upgrade — never deadlock)
  if (state.students.length === 0) {
    state.students = [{
      id: 's_demo',
      name: '示範同學',
      pin: '00000',
      avatar: '🌟',
      color: '#f59e0b',
      createdAt: new Date().toISOString()
    }];
    _persistStudents();
  }
  try {
    state.progress = JSON.parse(localStorage.getItem('yueProgress') || '{}');
  } catch(e) { state.progress = {}; }

  // Auto-seed sample dashboard data on first run (v1.1.2)
  // - Only triggers if: never seeded before AND no real progress exists
  // - Once seeded, localStorage flag prevents re-seeding even after clearing
  // - User can re-trigger manually from dashboard button
  _seedDemoProgress();

  // Load ASR engine preference
  const savedEngine = localStorage.getItem('yueAsrEngine');
  if (savedEngine && _ASR_ENGINES[savedEngine]) {
    state.asrEngine = savedEngine;
  }

  // Decide mode: if there are students, default student mode; otherwise prompt to add
  state.mode = 'student';
  // Restore last student if any
  const lastStudent = localStorage.getItem('yueLastStudentId');
  if (lastStudent && state.students.find(s => s.id === lastStudent)) {
    state.currentStudentId = lastStudent;
  }

  _renderLoginMode();
  updateProgress();
}

// Build flat words array from currently enabled categories
function _rebuildWords() {
  state.words = [];
  state.categories.forEach(cat => {
    if (cat.enabled) {
      cat.words.forEach(w => {
        state.words.push({ ...w, categoryId: cat.id, categoryLabel: cat.label });
      });
    }
  });
  state.selectedCategoryIds = state.categories.filter(c => c.enabled).map(c => c.id);
}

// ================== LOGIN ==================
let _pinBuffer = '';

function _renderLoginMode() {
  const pinMode = document.getElementById('loginPinMode');
  const gridMode = document.getElementById('loginGridMode');
  if (state.students.length === 0) {
    pinMode.style.display = 'none';
    gridMode.style.display = 'none';
    // Show empty hint
    const home = document.getElementById('home');
    let hint = document.getElementById('noStudentsHint');
    if (!hint) {
      hint = document.createElement('div');
      hint.id = 'noStudentsHint';
      hint.style.cssText = 'text-align:center;color:#1a1a2e;font-size:1.1em;margin:20px 0;';
      hint.innerHTML = '<p>尚未新增任何學生</p><p style="font-size:0.95em;margin-top:10px;">請先撳「老師模式」加入學生</p>';
      home.querySelector('.home-card').appendChild(hint);
    }
    hint.style.display = 'block';
    return;
  }
  const hint = document.getElementById('noStudentsHint');
  if (hint) hint.style.display = 'none';

  const mode = state.loginMode;
  if (mode === 'pin') {
    pinMode.style.display = 'block';
    gridMode.style.display = 'none';
  } else if (mode === 'grid') {
    pinMode.style.display = 'none';
    gridMode.style.display = 'block';
    _renderStudentGrid();
  } else { // both — show both, students choose
    pinMode.style.display = 'block';
    gridMode.style.display = 'block';
    _renderStudentGrid();
  }
}

function pinPress(digit) {
  if (_pinBuffer.length >= 5) return;
  _pinBuffer += digit;
  _updatePinDisplay();
  if (_pinBuffer.length === 5) {
    setTimeout(_tryPinLogin, 200);
  }
}

function pinBackspace() {
  _pinBuffer = _pinBuffer.slice(0, -1);
  _updatePinDisplay();
}

function pinClear() {
  _pinBuffer = '';
  _updatePinDisplay();
  document.getElementById('loginError').textContent = '';
}

function _updatePinDisplay() {
  const slots = document.querySelectorAll('#pinDisplay .pin-slot');
  slots.forEach((s, i) => {
    if (i < _pinBuffer.length) {
      s.textContent = _pinBuffer[i];
      s.classList.add('filled');
    } else {
      s.textContent = '·';
      s.classList.remove('filled');
    }
  });
}

function _tryPinLogin() {
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  const match = state.students.find(s => s.pin === _pinBuffer);
  if (match) {
    _loginStudent(match);
  } else {
    errEl.textContent = '❌ PIN 唔啱，再試多次';
    _pinBuffer = '';
    _updatePinDisplay();
  }
}

function quickLoginStudent(studentId) {
  const s = state.students.find(x => x.id === studentId);
  if (!s) return;
  document.getElementById('loginError2').textContent = '';
  // If PIN set, ask for it; otherwise login directly
  if (s.pin && s.pin.length === 5) {
    const input = prompt(`「${s.name}」請輸入你嘅 5 位 PIN：`);
    if (input === null) return;
    if (input !== s.pin) {
      document.getElementById('loginError2').textContent = '❌ PIN 唔啱';
      return;
    }

  _loginStudent(s);
}

  const name = document.getElementById('sm_name').value.trim();
  if (!name) { alert('請填寫姓名'); return; }

  if (pin && !/^\d{5}$/.test(pin)) { alert('PIN 必須係 5 位數字（0-9），或留空'); return; }
  const color = document.getElementById('sm_color').value;
  const avatar = _selectedEmoji;
  if (_editingStudent.studentId === null) {
    const id = 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    state.students.push({ id, name, pin, color, avatar, createdAt: new Date().toISOString() });
  } else {

    if (s) { s.name = name; s.pin = pin; s.color = color; s.avatar = avatar; }

  showToast('✅ 學生已儲存');

// ================== SAMPLE DATA SEED ==================
// Generate realistic-looking 14-day progress data so the teacher dashboard
// shows real charts out of the box. Idempotent: runs only once per browser
// (yueSeededDemo flag) and only if the user has no real progress yet.
const _DEMO_SEED_KEY = 'yueSeededDemo';
const _DEMO_SEED_VERSION = 'v1.1.3';

function _seedDemoProgress() {
  // Skip if already seeded in this version
  const seededAt = localStorage.getItem(_DEMO_SEED_KEY);
  if (seededAt === _DEMO_SEED_VERSION) return;

  // Don't clobber real user data
  const hasRealProgress = Object.keys(state.progress).length > 0;
  if (hasRealProgress) {
    // Mark as seeded so we never check again
    localStorage.setItem(_DEMO_SEED_KEY, _DEMO_SEED_VERSION);
    return;
  }

  if (state.students.length === 0 || state.words.length === 0) {
    // No data to seed against — defer
    return;
  }

  // Add 3 synthetic students so the dashboard has 4 students total.
  // Only if currently just the demo student exists (i.e., fresh install / first run).
  // If teacher has already added their own students, leave them alone.
  const now = Date.now();
  const day = 86400000;
  if (state.students.length === 1 && state.students[0].id === 's_demo') {
    const extras = [
      { id: 's_sarah', name: '曉怡', pin: '11111', avatar: '🌸', color: '#ec4899',
        createdAt: new Date(now - 32*day).toISOString() },
      { id: 's_tommy', name: '俊軒', pin: '22222', avatar: '🚀', color: '#3b82f6',
        createdAt: new Date(now - 28*day).toISOString() },
      { id: 's_amy',   name: '心悅', pin: '33333', avatar: '🦋', color: '#a855f7',
        createdAt: new Date(now - 21*day).toISOString() },
    ];
    state.students = [...state.students, ...extras];
    _persistStudents();
  }

  // Per-student profile: avg base, variance, attempt count, mastery level
  // Higher mastery = more words touched, higher bestScore
  // recentRatio = fraction of attempts that should land in the last 7 days
  // recentStreak = force this many consecutive recent days to each have ≥1 attempt (for 🔥 badge)
  // lowEngagement = student who falls behind (trigger engagement alert)
  const profileById = {
    's_demo':  { avgBase: 68, variance: 22, attempts: 32, mastery: 0.55, recentRatio: 0.55, recentStreak: 2 },
    's_sarah': { avgBase: 88, variance: 8,  attempts: 46, mastery: 0.85, recentRatio: 0.70, recentStreak: 5 },
    's_tommy': { avgBase: 48, variance: 24, attempts: 24, mastery: 0.40, recentRatio: 0.12, lowEngagement: true },
    's_amy':   { avgBase: 74, variance: 14, attempts: 38, mastery: 0.70, recentRatio: 0.60, recentStreak: 3 },
  };

  state.students.forEach((s) => {
    const prof = profileById[s.id] || { avgBase: 65, variance: 18, attempts: 28, mastery: 0.55, recentRatio: 0.50 };
    const prog = { byWord: {}, totalAttempts: 0, lastSession: null, scores: [] };

    // Which words this student will touch — mastery % of total vocab
    const targetWords = [];
    state.words.forEach((w, i) => {
      if (Math.random() < prof.mastery) targetWords.push(w);
    });
    // Guarantee at least a few words even for low-mastery
    if (targetWords.length < 3 && state.words.length >= 3) {
      for (let i = 0; i < 3; i++) targetWords.push(state.words[i]);
    }

    // For low-engagement students, force total attempts to be lower OR biased far back
    // so recent week has very few — triggers the new engagement alert
    if (prof.lowEngagement) {
      prof.attempts = Math.max(8, Math.floor(prof.attempts * 0.6));
    }

    // Force recentStreak: pre-place one attempt per day for the last N days (today, yesterday, ...)
    // so the streak counter visibly fires.
    if (prof.recentStreak) {
      for (let d = 0; d < prof.recentStreak; d++) {
        const ts = now - d * day - Math.floor(Math.random() * day * 0.5);
        const w = targetWords[Math.floor(Math.random() * targetWords.length)];
        const learningBoost = Math.max(0, (14 - d) * 0.6);
        const jitter = (Math.random() - 0.5) * prof.variance;
        const score = Math.max(20, Math.min(99, Math.round(prof.avgBase + learningBoost + jitter)));
        const at = new Date(ts).toISOString();
        prog.scores.push({ word: w.char, score, at });
        const key = w.char;
        if (!prog.byWord[key]) prog.byWord[key] = { bestScore: 0, attempts: 0, lastAt: null };
        if (score > prog.byWord[key].bestScore) prog.byWord[key].bestScore = score;
        prog.byWord[key].attempts += 1;
        if (!prog.byWord[key].lastAt || at > prog.byWord[key].lastAt) prog.byWord[key].lastAt = at;
      }
    }

    for (let i = 0; i < prof.attempts; i++) {
      // Cluster attempts toward recent days (skewed random) — but weight by recentRatio
      // recentRatio: high = bias toward last 7 days, low = bias toward older 7 days
      let daysAgo;
      if (Math.random() < prof.recentRatio) {
        // 0–7 days ago
        daysAgo = Math.floor(Math.random() * 8);
      } else {
        // 8–14 days ago
        daysAgo = 8 + Math.floor(Math.random() * 7);
      }
      const ts = now - daysAgo * day - Math.floor(Math.random() * day);

      // Pick a word (with mild recency bias — repeated practice on same word)
      const w = targetWords[Math.floor(Math.random() * targetWords.length)];

      // Learning curve: more recent days score slightly higher
      const learningBoost = Math.max(0, (14 - daysAgo) * 0.6);

      // Slight per-attempt jitter
      const jitter = (Math.random() - 0.5) * prof.variance;
      const score = Math.max(20, Math.min(99, Math.round(prof.avgBase + learningBoost + jitter)));
      const at = new Date(ts).toISOString();

      prog.scores.push({ word: w.char, score, at });
      prog.totalAttempts += 1;
      if (!prog.lastSession || at > prog.lastSession) prog.lastSession = at;

      const key = w.char;
      if (!prog.byWord[key]) {
        prog.byWord[key] = { bestScore: 0, attempts: 0, lastAt: null };
      }
      if (score > prog.byWord[key].bestScore) prog.byWord[key].bestScore = score;
      prog.byWord[key].attempts += 1;
      if (!prog.byWord[key].lastAt || at > prog.byWord[key].lastAt) {
        prog.byWord[key].lastAt = at;
      }
    }

    // Sort by time so trend lines render in chronological order
    prog.scores.sort((a, b) => new Date(a.at) - new Date(b.at));
    state.progress[s.id] = prog;
  });

  _persistProgress();
  localStorage.setItem(_DEMO_SEED_KEY, _DEMO_SEED_VERSION);
}

async function checkWhisperCache() {
  const container = document.getElementById('whisperCacheStatus');
  const content = document.getElementById('whisperCacheContent');
  if (!container || !content) return;
  // Show the cache section when system tab is rendered AND whisper was used
  if (state.asrEngine === 'whisper' || _ASR_ENGINES.whisper._pipeline) {
    container.style.display = 'block';
    if (_ASR_ENGINES.whisper._pipeline) {
      content.innerHTML = '✅ 模型已載入到記憶體。重新整理後會自動從 cache 恢復。';
    } else {
      // Check if there's likely a cached model via Cache Storage
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          const hfCache = keys.find(k => k.includes('huggingface') || k.includes('transformers'));
          if (hfCache) {
            content.innerHTML = '✅ 模型已 cache（離線可用）。點下方按鈕預載到記憶體。';
          } else {
            content.innerHTML = '⚠️ 模型未下載。點下方按鈕開始下載（約 40MB，需網絡）。';
          }
        } else {
          content.innerHTML = '⚠️ 尚未下載。';
        }
      } catch (e) {
        content.innerHTML = '⚠️ 狀態不明：' + e.message;
      }
    }
  } else {
    container.style.display = 'none';
  }
}

async function clearWhisperCache() {
  showConfirm('清除 Whisper 模型 cache？清除後需要重新下載。', async () => {
    try {
      // Clear transformers.js in-memory pipeline
      _ASR_ENGINES.whisper._pipeline = null;
      _ASR_ENGINES.whisper._pipelineLoading = null;
      // Clear Cache Storage entries that look like HF model files
      if ('caches' in window) {
        const keys = await caches.keys();
        for (const key of keys) {
          if (key.includes('huggingface') || key.includes('transformers') || key.includes('onnx')) {
            await caches.delete(key);
          }
        }
      }
      // Clear IndexedDB caches that transformers.js uses
      if ('databases' in indexedDB) {
        try {
          const dbs = await indexedDB.databases();
          for (const db of dbs) {
            if (db.name && (db.name.includes('huggingface') || db.name.includes('transformers') || db.name.includes('onnx'))) {
              indexedDB.deleteDatabase(db.name);
            }
          }
        } catch(e) {}
      }
      showToast('🗑 Whisper cache 已清除');
      checkWhisperCache();
    } catch (e) {
      showToast('❌ 清除失敗：' + e.message);
    }
  });
}

// ================== PROGRESS TRACKING ==================
function _recordAttempt(word, score, transcript) {
  if (!state.currentStudentId) return;
  const sid = state.currentStudentId;
  if (!state.progress[sid]) {
    state.progress[sid] = { byWord: {}, totalAttempts: 0, lastSession: null, scores: [] };
  }
  const p = state.progress[sid];
  if (!p.byWord[word]) {
    p.byWord[word] = { bestScore: 0, attempts: 0, lastTry: null, history: [] };
  }
  const w = p.byWord[word];
  // Defensive: old progress data (pre-history field, pre-lastTry) may be missing these.
  // The seed code in _seedDemoProgress still writes `lastAt` (no `lastTry`, no `history`),
  // and any byWord entry from an earlier version of the app may be in the old shape.
  // Guarding here prevents the throw that breaks `scorePronunciation` mid-flow.
  if (!w.history) w.history = [];
  if (!w.lastTry && w.lastAt) w.lastTry = w.lastAt;
  const now = new Date().toISOString();
  w.attempts += 1;
  w.lastTry = now;
  if (score > w.bestScore) w.bestScore = score;
  w.history.push({ score, transcript, at: now });
  // Cap history at last 20
  if (w.history.length > 20) w.history = w.history.slice(-20);
  p.totalAttempts += 1;
  p.lastSession = now;
  p.scores.push({ word, score, at: now });
  if (p.scores.length > 200) p.scores = p.scores.slice(-200);
  _persistProgress();
}

      <div style="background:rgba(124,58,237,0.3);border-radius:10px;padding:12px 6px;text-align:center;">

        <div style="font-size:1.9em;font-weight:bold;">${totalWords}</div>

      <img src="assets/images/decorative/empty-mic.png" alt="" style="width:140px;height:140px;margin:0 auto 8px;display:block;">

      </div>

  // ===== Mastery Funnel (4 stages) =====
  if (totalAttempts > 0) {

    const masteredCount = Object.values(state.progress).reduce((s, p) => s + Object.values(p.byWord || {}).filter(w => w.bestScore >= 80).length, 0);
    const practicingCount = Object.values(state.progress).reduce((s, p) => s + Object.values(p.byWord || {}).filter(w => w.bestScore >= 60 && w.bestScore < 80).length, 0);
    const touchedCount = Object.values(state.progress).reduce((s, p) => s + Object.values(p.byWord || {}).filter(w => w.attempts > 0 && w.bestScore < 60).length, 0);
    const untouchedCount = Math.max(0, totalSlots - masteredCount - practicingCount - touchedCount);
    const funnelStages = [
      { label: '未接觸', count: untouchedCount, color: 'rgba(255,255,255,0.3)' },
      { label: '接觸過', count: touchedCount, color: '#ef4444' },
      { label: '進步中', count: practicingCount, color: '#f59e0b' },

      <div style="font-size:0.85em;color:rgba(255,255,255,0.6);margin-bottom:10px;">全班 ${state.students.length} 學生 × ${state.words.length} 詞彙 = ${totalSlots} 個進度</div>
      ${_renderFunnel(funnelStages)}
    </div>`;
  }

  // ===== Category breakdown bar chart =====
  if (totalAttempts > 0) {
    const categoryStats = state.categories.filter(c => c.enabled).map(cat => {

  if (totalAttempts > 0) {

  }

  // ===== Class-wide weak spots Top 5 =====
  // _computeClassWeakSpots returns array of {word, avg, count} objects
  const wordDifficulty = _computeClassWeakSpots(allScores);
  if (wordDifficulty.length > 0) {

  // ===== Actionable alerts =====

    if (alerts.length > 0) {
      html += `<div style="background:rgba(239,68,68,0.1);border:2px solid rgba(239,68,68,0.3);border-radius:12px;padding:14px;margin-bottom:14px;">

      ${_renderPieChart(slices)}
    </div>`;
  }

  // ===== Per-student cards =====
  // Pre-compute a sort key per student and sort the array. Keeps the .map() template
  // simple and avoids recomputing signals (trend, engagement, struggling) twice.
  const now = new Date();
  const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
  const studentKeys = state.students.map(s => {
    const p = state.progress[s.id] || {};
    const allScores = p.scores || [];
    const filteredScores = filterScores(allScores);
    const attempts = filteredScores.length;
    const allByWord = p.byWord || {};
    const mastered = Object.values(allByWord).filter(w => w.bestScore >= 80).length;
    const struggling = Object.values(allByWord).filter(w => w.attempts >= 2 && w.bestScore < 60).length;
    // Trend: recent 5 vs prior 5
    let trendDiff = 0;
    if (allScores.length >= 6) {
      const recent = allScores.slice(-5).map(x => x.score);
      const prior = allScores.slice(-10, -5).map(x => x.score);
      if (prior.length > 0) {
        trendDiff = (recent.reduce((a, b) => a + b, 0) / recent.length) - (prior.reduce((a, b) => a + b, 0) / prior.length);
      }
    }
    // Engagement signal: recent-week attempts vs class average
    const recentWeekCount = allScores.filter(x => new Date(x.at) >= sevenDaysAgo).length;
    // No-practice signal
    const lastDate = p.lastSession ? new Date(p.lastSession) : null;
    const daysSince = lastDate ? Math.floor((now - lastDate) / (24 * 60 * 60 * 1000)) : 999;
    // Last 3 attempts
    const last3 = allScores.slice(-3).map(x => x.score);
    const recentStruggling = last3.length >= 3 && last3.every(x => x < 60);
    // Compute sort key per mode
    let key = 0;
    if (_dashSort === 'followup') {
      // Higher = more needs follow-up. Tie-break: name (stable).
      key = (daysSince >= 3 ? 100 : 0)
        + (recentStruggling ? 50 : 0)
        + (recentWeekCount === 0 && allScores.length > 0 ? 80 : 0) // dropped off
        + (recentWeekCount > 0 && recentWeekCount < 3 && allScores.length > recentWeekCount ? 30 : 0) // low engagement
        + (struggling * 20)
        - (mastered * 5);
      // Invert mastered: more mastered = less needs follow-up
      // We multiply by -1 when sorting so highest key comes first
      key = -key; // (will be sorted DESC by sort comparator below)
    } else if (_dashSort === 'progress') {
      key = -trendDiff; // biggest gain first (invert so DESC sort)
    } else if (_dashSort === 'practice') {
      // Fewest attempts first. New students (0 attempts) at top.
      key = attempts;
    } else {
      // 'default' = use the original index in state.students
      key = state.students.indexOf(s);
    }
    return { s, key, attempts, mastered, struggling, daysSince, recentWeekCount, recentStruggling, trendDiff };
  });
  // Sort by key ascending (since we inverted followup/progress already)
  if (_dashSort === 'followup') {
    // key was inverted (most-needs-help = most negative). Sort ascending.
    studentKeys.sort((a, b) => a.key - b.key);
  } else if (_dashSort === 'progress') {
    // key was inverted (biggest gain = most negative). Sort ascending.
    studentKeys.sort((a, b) => a.key - b.key);
  } else if (_dashSort === 'practice') {
    studentKeys.sort((a, b) => a.key - b.key);
  } // default: leave in state.students order
  const sortedStudents = studentKeys.map(x => x.s);

  html += `<p style="font-weight:bold;color:#f59e0b;margin:18px 0 8px;font-size:1.1em;">👨‍🎓 學生進度</p>`;
  html += sortedStudents.map(s => {
    const p = state.progress[s.id] || {};
    const filteredScores = filterScores(p.scores);
    const attempts = filteredScores.length;
    const lastSession = p.lastSession ? new Date(p.lastSession).toLocaleString('zh-HK', { month:'numeric', day:'numeric', hour:'numeric', minute:'numeric' }) : '—';
    const allByWord = p.byWord || {};
    const mastered = Object.values(allByWord).filter(w => w.bestScore >= 80).length;
    const struggling = Object.values(allByWord).filter(w => w.attempts >= 2 && w.bestScore < 60).length;
    const avg = attempts > 0 ? Math.round(filteredScores.reduce((sum, x) => sum + x.score, 0) / attempts) : 0;
    // Improvement: last 5 vs prior 5
    const allScoresList = p.scores || [];
    let trendLabel = '—';
    if (allScoresList.length >= 6) {
      const recent = allScoresList.slice(-5).map(x => x.score);
      const prior = allScoresList.slice(-10, -5).map(x => x.score);
      if (prior.length > 0) {
        const recentAvg = recent.reduce((a, b) => a + b, 0) / recent.length;
        const priorAvg = prior.reduce((a, b) => a + b, 0) / prior.length;
        const diff = Math.round(recentAvg - priorAvg);
        if (diff > 0) trendLabel = `↗ +${diff}`;
        else if (diff < 0) trendLabel = `↘ ${diff}`;
        else trendLabel = '→ ±0';
      }
    }
    const trendColor = trendLabel.startsWith('↗') ? '#22c55e' : trendLabel.startsWith('↘') ? '#ef4444' : 'rgba(255,255,255,0.6)';
    // Streak: consecutive days of practice ending today or yesterday
    const streak = _calcStreak(allScoresList);
    const streakBadge = streak >= 2
      ? `<span title="連續 ${streak} 日練習" style="background:linear-gradient(135deg,rgba(239,68,68,0.3),rgba(245,158,11,0.3));padding:2px 8px;border-radius:12px;font-size:0.85em;font-weight:bold;border:1px solid rgba(239,68,68,0.4);">🔥${streak}</span>`
      : '';
    return `<div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;margin:10px 0;border-left:6px solid ${s.color || '#f59e0b'};">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
        <span style="font-size:1.8em;">${s.avatar || '🌟'}</span>
        <span style="font-weight:bold;font-size:1.2em;flex:1;">${s.name}</span>
        <span style="background:rgba(255,255,255,0.15);padding:2px 10px;border-radius:12px;font-size:0.85em;">${attempts} 次</span>
        ${streakBadge}
        <span style="color:${trendColor};font-size:1em;font-weight:bold;">${trendLabel}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:0.9em;text-align:center;margin-bottom:6px;">
        <div style="background:rgba(34,197,94,0.2);padding:6px;border-radius:8px;">✅ ${mastered}</div>
        <div style="background:rgba(239,68,68,0.2);padding:6px;border-radius:8px;">⚠️ ${struggling}</div>
        <div style="background:rgba(245,158,11,0.2);padding:6px;border-radius:8px;">📊 ${avg}</div>
      </div>
      <div style="margin:6px 0;padding:0 2px;">
        ${_renderSessionDots(allScoresList, 7)}
      </div>
      <div style="font-size:0.85em;color:rgba(255,255,255,0.6);margin-top:6px;">最後練習：${lastSession}</div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button onclick="showStudentDetail('${s.id}')" style="flex:1;background:#0ea5e9;font-size:0.95em;padding:10px;min-height:42px;">📋 詳細</button>
        <button onclick="exportStudentReport('${s.id}')" style="flex:1;background:#f59e0b;font-size:0.95em;padding:10px;min-height:42px;">📄 報告</button>
      </div>
    </div>`;
  }).join('');

  // Top-level PDF export
  if (totalAttempts > 0) {
    html += `<button onclick="exportClassReport()" style="margin-top:16px;width:100%;background:#0ea5e9;font-size:1.05em;padding:14px;">📄 匯出全班報告 (PDF)</button>`;
  }

  // Dev/demo helper — re-seed sample data (for teacher demo / preview)
  // Shown only if demo data has been seeded; lets teacher refresh sample data
  if (localStorage.getItem(_DEMO_SEED_KEY) === _DEMO_SEED_VERSION) {
    html += `<div style="text-align:center;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,255,255,0.15);">
      <button onclick="_reseedDemoProgress()" style="background:transparent;color:rgba(255,255,255,0.5);font-size:0.85em;padding:6px 12px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;">🧪 重設示範數據</button>
    </div>`;
  }

  container.innerHTML = html;
}

// ================== WORD DRILL-DOWN ==================
// Teacher clicks a weak-spot word in the bar chart → this panel shows
// which students are struggling with that specific word, with a quick link
// into each student's detail view (with the word pre-highlighted).
function _openWordDrillDown(word) {
  _drillDownWord = word;
  renderDashboard();
  // Scroll the panel into view (it renders right after the bar chart)
  setTimeout(() => {
    const el = document.getElementById('wordDrillDownPanel');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function _closeWordDrillDown() {
  _drillDownWord = null;
  renderDashboard();
}

// Build the inline drill-down panel HTML.
// Shows: students whose bestScore on this word is < 70 (struggling or practicing).
// Sorted worst-first so the most-needs-help student is on top.
function _renderWordDrillDownPanel(word) {
  // Collect per-student best score for this word
  const rows = state.students.map(s => {
    const p = state.progress[s.id] || {};
    const byWord = p.byWord || {};
    const info = byWord[word];
    return {
      s,
      bestScore: info ? info.bestScore : null,
      attempts: info ? info.attempts : 0,
      lastTry: info ? info.lastTry : null
    };
  });
  // Split: struggling (has tried, < 70), practicing (>= 70), untouched
  const struggling = rows.filter(r => r.bestScore !== null && r.bestScore < 70)
    .sort((a, b) => a.bestScore - b.bestScore);
  const mastered = rows.filter(r => r.bestScore !== null && r.bestScore >= 70);
  const untouched = rows.filter(r => r.bestScore === null);

  const renderRow = (r, label, color) => {
    const isStruggling = r.bestScore !== null && r.bestScore < 70;
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,0.05);border-radius:8px;margin:4px 0;border-left:3px solid ${color};">
      <span style="font-size:1.3em;">${r.s.avatar || '🌟'}</span>
      <span style="flex:1;font-weight:bold;">${r.s.name}</span>
      <span style="font-size:0.85em;color:rgba(255,255,255,0.7);">${label}</span>
      <button onclick="showStudentDetail('${r.s.id}','${word.replace(/'/g, "\\'")}')" style="background:#0ea5e9;font-size:0.85em;padding:6px 10px;min-height:36px;">查看 →</button>
    </div>`;
  };

  return `<div id="wordDrillDownPanel" style="background:linear-gradient(135deg,rgba(245,158,11,0.15),rgba(239,68,68,0.15));border:2px solid rgba(245,158,11,0.4);border-radius:12px;padding:14px;margin-bottom:14px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <span style="font-size:1.5em;">🔍</span>
      <span style="font-weight:bold;color:#f59e0b;font-size:1.1em;flex:1;">「${word}」 — 邊啲學生掂緊？</span>
      <button onclick="_closeWordDrillDown()" style="background:rgba(255,255,255,0.15);font-size:0.85em;padding:4px 10px;min-height:32px;">✕ 關閉</button>
    </div>
    ${struggling.length > 0
      ? `<p style="font-size:0.85em;color:rgba(255,255,255,0.6);margin-bottom:6px;">⚠️ 掂緊緊（最高分 &lt; 70）— ${struggling.length} 人</p>
         ${struggling.map(r => renderRow(r, `${r.attempts} 次 • 最高 ${r.bestScore} 分`, '#ef4444')).join('')}`
      : ''}
    ${mastered.length > 0
      ? `<p style="font-size:0.85em;color:rgba(255,255,255,0.6);margin:10px 0 6px;">✅ 已掌握（最高分 ≥ 70）— ${mastered.length} 人</p>
         ${mastered.map(r => renderRow(r, `${r.attempts} 次 • 最高 ${r.bestScore} 分`, '#22c55e')).join('')}`
      : ''}
    ${untouched.length > 0
      ? `<p style="font-size:0.85em;color:rgba(255,255,255,0.5);margin:10px 0 6px;">未接觸 — ${untouched.length} 人</p>
         ${untouched.map(r => renderRow(r, '未試過', 'rgba(255,255,255,0.2)')).join('')}`
      : ''}
  </div>`;
}

// Build actionable alerts (3-day no practice, struggling streak, etc.)
function _buildAlerts(allScores) {
  const alerts = [];
  const now = new Date();
  const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
  state.students.forEach(s => {
    const p = state.progress[s.id] || {};
    const scores = p.scores || [];
    if (scores.length === 0) return;
    // Alert 1: 3+ days no practice
    const lastDate = p.lastSession ? new Date(p.lastSession) : null;
    if (lastDate) {
      const daysSince = Math.floor((now - lastDate) / (24 * 60 * 60 * 1000));
      if (daysSince >= 3) {
        alerts.push(`${s.avatar} <b>${s.name}</b>：${daysSince} 日冇練習`);
      }
    }
    // Alert 2: last 3 attempts all < 60
    const last3 = scores.slice(-3).map(x => x.score);
    if (last3.length >= 3 && last3.every(s => s < 60)) {
      alerts.push(`${s.avatar} <b>${s.name}</b>：最近 3 次都 &lt; 60 分`);
    }
  });
  // Alert 4: low engagement — student practicing much less than class avg (last 7 days)
  // Only meaningful when the class has at least 2 active students in the last 7 days,
  // and the low-engagement student has SOME history (otherwise it's a fresh student, not a dip).
  const weeklyCounts = state.students.map(s => {
    const p = state.progress[s.id] || {};
    const recent = (p.scores || []).filter(x => new Date(x.at) >= sevenDaysAgo);
    return { s, recent: recent.length, total: (p.scores || []).length };
  });
  const activeThisWeek = weeklyCounts.filter(x => x.recent > 0);
  if (activeThisWeek.length >= 2) {
    const classAvg = activeThisWeek.reduce((sum, x) => sum + x.recent, 0) / activeThisWeek.length;
    if (classAvg >= 2) {
      weeklyCounts.forEach(({ s, recent, total }) => {
        // Trigger: this student is at < 50% of class avg this week, AND has older history
        // (so we know they used to practice — flags a real engagement dip, not a fresh start).
        // recent=0 with total>0 means they totally dropped off this week — even stronger signal.
        if (recent < classAvg * 0.5 && total > recent) {
          alerts.push(`⚠️ <b>${s.name}</b>：本週只練 ${recent} 次（班平均 ${Math.round(classAvg)} 次）`);
        }
      });
    }
  }
  // Alert 3: words that 50%+ students score < 50
  const wordFail = {};
  state.students.forEach(s => {
    const p = state.progress[s.id] || {};
    Object.entries(p.byWord || {}).forEach(([w, info]) => {
      if (!wordFail[w]) wordFail[w] = { fail: 0, total: 0 };
      wordFail[w].total += 1;
      if (info.bestScore < 50) wordFail[w].fail += 1;
    });
  });
  Object.entries(wordFail).forEach(([w, info]) => {
    if (info.total >= 2 && info.fail / info.total >= 0.5) {
      alerts.push(`📌 <b>${w}</b>：${info.fail}/${info.total} 學生 &lt; 50 分（建議全班重溫）`);
    }
  });
  return alerts.slice(0, 8);
}

// Render a tiny SVG sparkline of scores over time
function _renderSparkline(data, width, height) {
  if (!data || data.length < 2) return '';
  const max = 100, min = 0;
  const stepX = width / (data.length - 1);
  const points = data.map((v, i) => {
    const x = i * stepX;
    const y = height - ((v - min) / (max - min)) * height;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const last = data[data.length - 1];
  const lastColor = last >= 80 ? '#22c55e' : last >= 60 ? '#f59e0b' : '#ef4444';
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:30px;">
    <polyline points="${points}" fill="none" stroke="${lastColor}" stroke-width="2"/>
    <circle cx="${((data.length-1)*stepX).toFixed(1)}" cy="${(height - ((last-min)/(max-min))*height).toFixed(1)}" r="3" fill="${lastColor}"/>
  </svg>`;
}

// Render a row of N colored dots, one per recent practice session.
// Color: green ≥80 (mastered), amber 60-79 (practicing), red <60 (struggling), gray = no data.
// `scores` is the student's full score history; we take the last N.
function _renderSessionDots(scores, n) {
  n = n || 7;
  const recent = (scores || []).slice(-n);
  // Pad with nulls on the LEFT so the rightmost dot is always the most recent
  const padded = [];
  for (let i = 0; i < n - recent.length; i++) padded.push(null);
  for (const s of recent) padded.push(s);
  const dots = padded.map((s, i) => {
    if (s === null) {
      return `<span title="第 ${i+1} 次：未有數據" style="display:inline-block;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);margin:0 1px;vertical-align:middle;"></span>`;
    }
    const c = s.score >= 80 ? '#22c55e' : s.score >= 60 ? '#f59e0b' : '#ef4444';
    const word = s.word || '';
    const date = s.at ? new Date(s.at).toLocaleString('zh-HK', { month:'numeric', day:'numeric' }) : '';
    return `<span title="第 ${i+1} 次：${word} ${s.score} 分（${date}）" style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${c};box-shadow:0 0 0 1px rgba(0,0,0,0.3) inset;margin:0 1px;vertical-align:middle;"></span>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:6px;font-size:0.8em;color:rgba(255,255,255,0.5);">
    <span style="flex-shrink:0;">近 ${n} 次：</span>
    <span style="flex:1;letter-spacing:0;line-height:1;">${dots}</span>
  </div>`;
}

// ================== SVG VISUALIZATION UTILITIES ==================

// Strip heatmap: N days as colored cells. data = array of {date, count}
function _renderStripHeatmap(data, days) {
  days = days || 7;
  data = data || [];
  const cellSize = 28, gap = 4;
  const totalW = days * (cellSize + gap);
  let html = `<svg viewBox="0 0 ${totalW} ${cellSize}" style="width:100%;max-width:320px;height:${cellSize}px;">`;
  for (let i = 0; i < days; i++) {
    const cell = data[i] || { count: 0 };
    const intensity = Math.min(1, cell.count / 5);
    const color = cell.count === 0 ? 'rgba(255,255,255,0.1)'
      : intensity < 0.4 ? 'rgba(34,197,94,0.4)'
      : intensity < 0.8 ? 'rgba(34,197,94,0.7)'
      : '#22c55e';
    const x = i * (cellSize + gap);
    const label = cell.date ? new Date(cell.date).getDate() : '';
    html += `<rect x="${x}" y="0" width="${cellSize}" height="${cellSize}" rx="6" fill="${color}" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;
    if (label) {
      html += `<text x="${x + cellSize/2}" y="${cellSize - 6}" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.6)">${label}</text>`;
    }
  }
  html += '</svg>';
  return html;
}

// 4-week × 7-day heatmap (like GitHub contributions)
function _renderWeekHeatmap(weeklyData) {
  // weeklyData = [{day0..day6: count}, ...] up to 4 weeks
  const cellSize = 22, gap = 3;
  const labelW = 28, headerH = 18;
  const w = labelW + 7 * (cellSize + gap);
  const h = headerH + 4 * (cellSize + gap);
  const dayLabels = ['一', '二', '三', '四', '五', '六', '日'];
  let html = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:280px;height:${h}px;">`;
  // Day labels
  dayLabels.forEach((lbl, i) => {
    html += `<text x="0" y="${headerH + i * (cellSize + gap) + cellSize * 0.7}" font-size="10" fill="rgba(255,255,255,0.5)">${lbl}</text>`;
  });
  // Cells
  for (let w = 0; w < 4; w++) {
    for (let d = 0; d < 7; d++) {
      const count = (weeklyData[w] && weeklyData[w][d]) || 0;
      const intensity = Math.min(1, count / 5);
      const color = count === 0 ? 'rgba(255,255,255,0.08)'
        : intensity < 0.4 ? 'rgba(34,197,94,0.35)'
        : intensity < 0.8 ? 'rgba(34,197,94,0.6)'
        : '#22c55e';
      const x = labelW + d * (cellSize + gap);
      const y = headerH + w * (cellSize + gap);
      html += `<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" rx="4" fill="${color}"/>`;
    }
  }
  html += '</svg>';
  return html;
}

// Horizontal bar chart for weak spots
// If `clickFnName` is provided (string, name of a global function), each row is clickable
// and invokes `clickFnName(encodedLabel)` on click. Used for word → student drill-down.
function _renderBarChart(items, maxValue, clickFnName) {
  // items = [{label, value, count}]
  maxValue = maxValue || 100;
  const rowH = 26, gap = 8, labelW = 70, countW = 60, barAreaW = 160;
  const totalH = items.length * (rowH + gap);
  const totalW = labelW + barAreaW + countW;
  let html = `<svg viewBox="0 0 ${totalW} ${totalH}" style="width:100%;height:${totalH}px;">`;
  items.forEach((item, i) => {
    const y = i * (rowH + gap);
    const pct = (item.value / maxValue) * 100;
    const barColor = item.value < 50 ? '#ef4444' : item.value < 70 ? '#f59e0b' : '#22c55e';
    const rowInner = `
      <text x="0" y="${y + rowH/2 + 4}" font-size="12" fill="rgba(255,255,255,0.9)" font-weight="bold">${item.label}</text>
      <rect x="${labelW}" y="${y + 4}" width="${barAreaW}" height="${rowH - 8}" rx="4" fill="rgba(0,0,0,0.3)"/>
      <rect x="${labelW}" y="${y + 4}" width="${barAreaW * pct / 100}" height="${rowH - 8}" rx="4" fill="${barColor}"/>
      <text x="${labelW + barAreaW * pct / 100 + 4}" y="${y + rowH/2 + 4}" font-size="11" fill="#fff" font-weight="bold">${item.value}${item.suffix || ''}</text>
      ${item.count !== undefined ? `<text x="${labelW + barAreaW + 8}" y="${y + rowH/2 + 4}" font-size="10" fill="rgba(255,255,255,0.5)">${item.count}次</text>` : ''}
    `;
    if (clickFnName) {
      // Escape quotes/backslash/newlines for safe injection into onclick attribute
      const safe = String(item.label).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
      html += `<g onclick="${clickFnName}('${safe}')" style="cursor:pointer;">${rowInner}</g>`;
    } else {
      html += rowInner;
    }
  });
  html += '</svg>';
  return html;
}

// Mastery funnel
function _renderFunnel(stages) {
  // stages = [{label, count, color}]
  const maxCount = Math.max(1, ...stages.map(s => s.count));
  const rowH = 36, gap = 6, totalH = stages.length * (rowH + gap);
  let html = `<svg viewBox="0 0 280 ${totalH}" style="width:100%;height:${totalH}px;">`;
  stages.forEach((stage, i) => {
    const y = i * (rowH + gap);
    const pct = stage.count / maxCount;
    const barW = 240 * pct;
    const barX = (280 - barW) / 2;
    html += `<text x="0" y="${y + rowH/2 + 4}" font-size="12" fill="rgba(255,255,255,0.85)" font-weight="bold">${stage.label}</text>`;
    html += `<rect x="${barX}" y="${y + 4}" width="${barW}" height="${rowH - 8}" rx="6" fill="${stage.color}"/>`;
    html += `<text x="140" y="${y + rowH/2 + 4}" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">${stage.count}</text>`;
    if (i < stages.length - 1) {
      html += `<text x="270" y="${y + rowH/2 + 4}" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.5)">${Math.round(pct*100)}%</text>`;
    }
  });
  html += '</svg>';
  return html;
}

// 30-day line chart of class average
function _renderLineChart(dailyData, options) {
  // dailyData = [{date, avg, count}] length = 30
  options = options || {};
  const width = options.width || 320;
  const height = options.height || 100;
  const padTop = 8, padBot = 18, padLeft = 28, padRight = 8;
  const chartW = width - padLeft - padRight;
  const chartH = height - padTop - padBot;

  if (!dailyData || dailyData.length === 0) {
    return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:${height}px;"><text x="${width/2}" y="${height/2}" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">無數據</text></svg>`;
  }

  // Y-axis grid lines at 0, 50, 100
  const gridLines = [0, 50, 100];
  let html = `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:${height}px;">`;
  gridLines.forEach(v => {
    const y = padTop + chartH - (v / 100) * chartH;
    html += `<line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;
    html += `<text x="${padLeft - 4}" y="${y + 3}" text-anchor="end" font-size="9" fill="rgba(255,255,255,0.4)">${v}</text>`;
  });

  const stepX = chartW / Math.max(1, dailyData.length - 1);
  const points = dailyData.map((d, i) => {
    const x = padLeft + i * stepX;
    const y = padTop + chartH - (d.avg / 100) * chartH;
    return { x, y, ...d };
  });
  const polyStr = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  // Area fill
  const areaPath = `M ${points[0].x},${padTop + chartH} L ${polyStr} L ${points[points.length-1].x},${padTop + chartH} Z`;
  html += `<path d="${areaPath}" fill="rgba(124,58,237,0.3)"/>`;
  html += `<polyline points="${polyStr}" fill="none" stroke="#7c3aed" stroke-width="2"/>`;
  // Last point dot
  const last = points[points.length - 1];
  html += `<circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3" fill="#7c3aed"/>`;
  // X labels (start, mid, end)
  const labelIndices = [0, Math.floor(dailyData.length / 2), dailyData.length - 1];
  labelIndices.forEach(i => {
    const d = new Date(dailyData[i].date);
    const label = `${d.getMonth() + 1}/${d.getDate()}`;
    html += `<text x="${points[i].x.toFixed(1)}" y="${height - 4}" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.4)">${label}</text>`;
  });
  html += '</svg>';
  return html;
}

// Pie chart for ASR engine distribution
function _renderPieChart(slices) {
  // slices = [{label, value, color, emoji}]
  const total = slices.reduce((s, x) => s + x.value, 0);
  const cx = 80, cy = 80, r = 70;
  let html = `<svg viewBox="0 0 280 160" style="width:100%;height:160px;">`;
  if (total === 0) {
    html += `<text x="80" y="80" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">無數據</text>`;
  } else {
    let angle = -Math.PI / 2;
    slices.forEach(slice => {
      if (slice.value === 0) return;
      const sliceAngle = (slice.value / total) * Math.PI * 2;
      const x1 = cx + r * Math.cos(angle);
      const y1 = cy + r * Math.sin(angle);
      const x2 = cx + r * Math.cos(angle + sliceAngle);
      const y2 = cy + r * Math.sin(angle + sliceAngle);
      const largeArc = sliceAngle > Math.PI ? 1 : 0;
      const path = `M ${cx},${cy} L ${x1},${y1} A ${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z`;
      html += `<path d="${path}" fill="${slice.color}" stroke="#1a1a2e" stroke-width="2"/>`;
      angle += sliceAngle;
    });
  }
  // Legend
  let legendY = 16;
  slices.forEach(slice => {
    const pct = total > 0 ? Math.round(slice.value / total * 100) : 0;
    html += `<rect x="170" y="${legendY - 8}" width="12" height="12" rx="2" fill="${slice.color}"/>`;
    html += `<text x="186" y="${legendY + 2}" font-size="11" fill="rgba(255,255,255,0.9)">${slice.emoji} ${slice.label}</text>`;
    html += `<text x="276" y="${legendY + 2}" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.6)">${slice.value} (${pct}%)</text>`;
    legendY += 20;
  });
  html += '</svg>';
  return html;
}

// Build last N days of attempt counts (for strip heatmap)
function _buildDailyCounts(scores, days) {
  days = days || 7;
  const result = [];
  const now = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
    const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const dayEnd = new Date(dayStart.getTime() + 24 * 60 * 60 * 1000);
    const count = scores.filter(s => {
      const t = new Date(s.at);
      return t >= dayStart && t < dayEnd;
    }).length;
    result.push({ date: dayStart.toISOString(), count });
  }
  return result;
}

// Build 4-week heatmap data: array of 4 weeks, each = [7 days count]
function _buildWeeklyHeatmap(scores) {
  const result = [[], [], [], []];
  const now = new Date();
  for (let w = 0; w < 4; w++) {
    for (let d = 0; d < 7; d++) {
      const daysAgo = (3 - w) * 7 + (6 - d);
      const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysAgo);
      const dayEnd = new Date(dayStart.getTime() + 24 * 60 * 60 * 1000);
      const count = scores.filter(s => {
        const t = new Date(s.at);
        return t >= dayStart && t < dayEnd;
      }).length;
      result[w][d] = count;
    }
  }
  return result;
}

// Build daily avg for N days (for line chart)
function _buildDailyAvg(scores, days) {
  days = days || 30;
  const result = [];
  const now = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
    const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const dayEnd = new Date(dayStart.getTime() + 24 * 60 * 60 * 1000);
    const dayScores = scores.filter(s => {
      const t = new Date(s.at);
      return t >= dayStart && t < dayEnd;
    });
    result.push({
      date: dayStart.toISOString(),
      avg: dayScores.length > 0 ? Math.round(dayScores.reduce((sum, x) => sum + x.score, 0) / dayScores.length) : 0,
      count: dayScores.length
    });
  }
  return result;
}

// Calculate consecutive-day streak from scores
function _calcStreak(scores) {
  if (!scores || scores.length === 0) return 0;
  const dates = new Set(scores.map(s => new Date(s.at).toDateString()));
  let streak = 0;
  const today = new Date();
  // Allow today OR yesterday to be the streak start (don't break streak if not practiced today)
  let checkDate = new Date(today);
  if (!dates.has(checkDate.toDateString())) {
    checkDate = new Date(today.getTime() - 24 * 60 * 60 * 1000);
    if (!dates.has(checkDate.toDateString())) return 0;
  }
  while (dates.has(checkDate.toDateString())) {
    streak++;
    checkDate = new Date(checkDate.getTime() - 24 * 60 * 60 * 1000);
  }
  return streak;
}

// Compute class-wide weak spots (words with lowest avg score across all students)
function _computeClassWeakSpots(scores) {
  // Defensive: scores MUST be an array. If a function slips through (e.g. forgot to call it),
  // bail out instead of crashing the whole dashboard.
  if (!Array.isArray(scores) || scores.length === 0) return [];
  const byWord = {};
  scores.forEach(s => {
    if (!byWord[s.word]) byWord[s.word] = { sum: 0, count: 0 };
    byWord[s.word].sum += s.score;
    byWord[s.word].count += 1;
  });
  return Object.entries(byWord)
    .filter(([_, info]) => info.count >= 1)
    .map(([word, info]) => ({ word, avg: Math.round(info.sum / info.count), count: info.count }))
    .sort((a, b) => a.avg - b.avg);
}

function showStudentDetail(studentId, focusWord) {
  const s = state.students.find(x => x.id === studentId);
  if (!s) return;
  const p = state.progress[studentId] || { byWord: {}, scores: [] };
  const words = Object.entries(p.byWord || {}).sort((a, b) => b[1].attempts - a[1].attempts);
  // If a focusWord is provided, lift it to the top of the list (whether or not the student
  // has any history for it). When lifted, give it a yellow ring so the teacher sees why it's there.
  if (focusWord) {
    const idx = words.findIndex(([w]) => w === focusWord);
    if (idx >= 0) {
      const [w, info] = words.splice(idx, 1)[0];
      words.unshift([w, info]);
    } else {
      // Word has no history for this student — show a "未試過" entry at the top
      words.unshift([focusWord, { bestScore: null, attempts: 0, lastTry: null }]);
    }
  }
  let html = `<div style="max-width:700px;margin:0 auto;">
    <h2 style="color:#f59e0b;">${s.avatar || '🌟'} ${s.name} 練習記錄</h2>
    <div style="background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;margin:10px 0;">
      <div style="font-size:1.1em;margin-bottom:8px;">
        總練習次數：<b>${p.totalAttempts || 0}</b>
        ${p.lastSession ? '• 最後：' + new Date(p.lastSession).toLocaleString('zh-HK') : ''}
      </div>
    </div>
    <h3 style="color:#f59e0b;margin-top:20px;">逐個詞彙</h3>
    <div style="max-height:400px;overflow:auto;">`;
  if (words.length === 0) {
    html += '<div style="text-align:center;padding:30px 16px;"><img src="assets/images/decorative/empty-records.png" alt="" style="width:160px;height:160px;margin:0 auto 12px;display:block;border-radius:12px;"><p style="color:rgba(255,255,255,0.6);">尚未有練習記錄</p></div>';
  } else {
    words.forEach(([word, data]) => {
      const isFocus = focusWord && word === focusWord;
      const status = data.bestScore === null ? '❔' : data.bestScore >= 80 ? '✅' : data.bestScore >= 60 ? '👍' : '⚠️';
      const lastTry = data.lastTry ? new Date(data.lastTry).toLocaleString('zh-HK', { month:'numeric', day:'numeric', hour:'numeric', minute:'numeric' }) : '';
      const scoreTrend = (data.history || []).slice(-5).map(h => h.score);
      const miniBar = scoreTrend.map(sc => {
        const c = sc >= 80 ? '#22c55e' : sc >= 60 ? '#f59e0b' : '#ef4444';
        return `<div style="display:inline-block;width:6px;height:${Math.max(4, sc/3)}px;background:${c};margin-right:2px;border-radius:2px;vertical-align:bottom;" title="${sc}分"></div>`;
      }).join('');
      const focusStyle = isFocus ? 'border:2px solid #f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,0.25);' : '';
      const focusBadge = isFocus ? `<span style="background:#f59e0b;color:#000;padding:2px 8px;border-radius:8px;font-size:0.75em;font-weight:bold;margin-left:6px;">📍 從全班難點跳嚟</span>` : '';
      const detailLine = data.bestScore === null
        ? '未試過呢個詞'
        : `${data.attempts} 次嘗試 • 最高 ${data.bestScore} 分 • ${lastTry}`;
      html += `<div id="${isFocus ? 'wordDrillDownFocus' : ''}" style="display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,0.05);border-radius:8px;margin:6px 0;${focusStyle}">
        <span style="font-size:1.5em;">${status}</span>
        <div style="flex:1;">
          <div style="font-weight:bold;font-size:1.1em;">${word}${focusBadge}</div>
          <div style="font-size:0.85em;color:rgba(255,255,255,0.6);">${detailLine}</div>
          <div style="margin-top:4px;display:flex;align-items:flex-end;height:36px;">${miniBar}</div>
        </div>
      </div>`;
    });
  }
  html += `</div>
    <div style="display:flex;gap:8px;margin-top:20px;">
      <button onclick="exportStudentReport('${studentId}')" style="flex:1;background:#f59e0b;font-size:1em;padding:12px;">📄 匯出 PDF 報告</button>
      <button onclick="renderDashboard();switchAdminTab('dashboard');" style="flex:1;background:#666;font-size:1em;padding:12px;">返回 Dashboard</button>
    </div>
  </div>`;
  document.getElementById('dashboardContent').innerHTML = html;
  // If a focusWord was passed, scroll to the highlighted row
  if (focusWord) {
    setTimeout(() => {
      const focusEl = document.getElementById('wordDrillDownFocus');
      if (focusEl) focusEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  }
}
