  const a = document.createElement('a');
  a.href = url;
  a.download = 'students_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('⬇️ 已下載學生資料');
}

function importStudentsJson(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.students || !Array.isArray(data.students)) {
        throw new Error('JSON 格式錯誤');
      }
      showConfirm(`將匯入 ${data.students.length} 個學生（同 ${Object.keys(data.progress || {}).length} 個進度記錄）。現有資料會被合併（同名學生覆蓋）。確定？`, () => {
        // Merge: by id, new wins
        const existingById = {};
        state.students.forEach(s => existingById[s.id] = s);
        data.students.forEach(s => { existingById[s.id] = s; });
        state.students = Object.values(existingById);
        if (data.progress) {
          Object.assign(state.progress, data.progress);
        }
        if (data.loginMode) state.loginMode = data.loginMode;
        _persistStudents();
        _persistProgress();
        renderStudentList();
        _renderLoginMode();
        renderDashboard();
        showToast('⬆️ 匯入成功！');
      });
    } catch(err) {
      alert('匯入失敗：' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// Admin panel
function toggleAdminPanel() {
  const panel = document.getElementById('adminPanel');
  const arrow = document.getElementById('adminArrow');
  const isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'block' : 'none';
  arrow.textContent = isHidden ? '▲' : '▼';
  if (isHidden) renderAdminCategoryList();
}

function renderAdminCategoryList() {
  const container = document.getElementById('adminCategoryList');
  if (state.categories.length === 0) {
    container.innerHTML = '<p style="color:#f59e0b;">尚無詞彙分類，請確認 data/words.json 已正確載入。</p>';
    return;
  }
  container.innerHTML = state.categories.map(cat => {
    const wordCount = cat.words ? cat.words.length : 0;
    return `<label style="display:flex;align-items:center;gap:12px;margin:10px 0;font-size:1.2em;cursor:pointer;">
      <input type="checkbox" id="cat_toggle_${cat.id}"
        ${cat.enabled ? 'checked' : ''}
        onchange="toggleAdminCat('${cat.id}', this.checked)"
        style="width:26px;height:26px;accent-color:#f59e0b;">
      <span style="font-weight:bold;color:#f59e0b;min-width:80px;">${cat.label}</span>
      <span style="color:rgba(255,255,255,0.7);flex:1;">${cat.description || ''}</span>
      <span style="background:rgba(255,255,255,0.15);padding:2px 10px;border-radius:12px;font-size:0.85em;">${wordCount}詞</span>
    </label>`;
  }).join('');
}

// Temporary tracking of pending toggles before save
let _pendingCatToggles = {};
function toggleAdminCat(catId, checked) {
  _pendingCatToggles[catId] = checked;
}

function saveAdminSettings() {
  // Merge pending toggles into actual categories
  Object.keys(_pendingCatToggles).forEach(catId => {
    const cat = state.categories.find(c => c.id === catId);
    if (cat) cat.enabled = _pendingCatToggles[catId];
  });
  _pendingCatToggles = {};
  // Persist overrides to localStorage
  const overrides = {};
  state.categories.forEach(cat => { overrides[cat.id] = cat.enabled; });
  localStorage.setItem('yueAdminSettings', JSON.stringify(overrides));
  _rebuildWords();
  renderAdminCategoryList();
  renderEditCategoryList();
  showToast('✅ 設定已儲存！');
}

// ================== EDIT TAB: CRUD ==================
let _editingWord = null; // { catId, wordIndex } | null
let _editingCatId = null;
let _confirmCallback = null;

function switchAdminTab(tab) {
  const tabs = [
    { btn: 'tabSettingsBtn', content: 'tabSettingsContent' },
    { btn: 'tabEditBtn', content: 'tabEditContent' },
    { btn: 'tabStudentsBtn', content: 'tabStudentsContent' },
    { btn: 'tabDashboardBtn', content: 'tabDashboardContent' },
    { btn: 'tabSystemBtn', content: 'tabSystemContent' }
  ];
  const activeBtn = 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Btn';
  const activeContent = 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Content';
  tabs.forEach(t => {
    const btn = document.getElementById(t.btn);
    const content = document.getElementById(t.content);
    if (btn) btn.style.background = (t.btn === activeBtn) ? '#7c3aed' : '#444';
    if (content) content.style.display = (t.content === activeContent) ? 'block' : 'none';
  });
  if (tab === 'edit') renderEditCategoryList();
  if (tab === 'students') renderStudentList();
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'system') renderAsrEngineList();
}

function renderEditCategoryList() {
  const container = document.getElementById('editCategoryList');
  if (state.categories.length === 0) {
    container.innerHTML = '<p style="color:rgba(255,255,255,0.6);padding:12px 0;">尚無分類，請新增。</p>';
    return;
  }
  container.innerHTML = state.categories.map(cat => {
    const wordCount = cat.words ? cat.words.length : 0;
    const wordsHtml = (cat.words || []).map((w, idx) => `
      <div style="display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,0.05);border-radius:8px;margin:4px 0;">
        <span style="font-size:1.3em;font-weight:bold;color:#7c3aed;min-width:60px;">${w.char}</span>
        <span style="color:rgba(255,255,255,0.6);font-size:0.95em;flex:1;">${w.pinyin || ''} ${w.meaning ? '• ' + w.meaning : ''}</span>
        <button onclick="editWord('${cat.id}', ${idx})" style="background:#0ea5e9;min-height:36px;padding:6px 12px;font-size:0.9em;">✏️</button>
        <button onclick="deleteWord('${cat.id}', ${idx})" style="background:#dc2626;min-height:36px;padding:6px 12px;font-size:0.9em;">🗑</button>
      </div>
    `).join('');
    return `
      <div style="background:rgba(255,255,255,0.05);border-radius:12px;margin:10px 0;padding:12px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span style="font-weight:bold;color:#f59e0b;font-size:1.15em;flex:1;">${cat.label}</span>
          <span style="background:rgba(255,255,255,0.15);padding:2px 10px;border-radius:12px;font-size:0.85em;">${wordCount}詞</span>
          <button onclick="editCategory('${cat.id}')" style="background:#0ea5e9;min-height:36px;padding:6px 12px;font-size:0.9em;">✏️</button>
          <button onclick="deleteCategory('${cat.id}')" style="background:#dc2626;min-height:36px;padding:6px 12px;font-size:0.9em;">🗑</button>
        </div>
        <div style="font-size:0.85em;color:rgba(255,255,255,0.5);margin-bottom:6px;">${cat.description || ''}</div>
        <div style="margin-top:8px;">${wordsHtml || '<div style="color:rgba(255,255,255,0.4);font-size:0.9em;padding:6px;">此分類暫無詞彙</div>'}</div>
        <button onclick="addWordToCategory('${cat.id}')" style="background:#7c3aed;margin-top:8px;width:100%;font-size:0.95em;padding:10px;min-height:44px;">＋ 新增詞彙</button>
      </div>
    `;
  }).join('');
}

// ---- Word CRUD ----
function addWordToCategory(catId) {
  _editingWord = { catId, wordIndex: -1 };
  document.getElementById('wordModalTitle').textContent = '✏️ 新增詞彙';
  document.getElementById('wm_char').value = '';
  document.getElementById('wm_pinyin').value = '';
  document.getElementById('wm_meaning').value = '';
  document.getElementById('wm_target').value = '';
  document.getElementById('wm_image').value = '';
  document.getElementById('wordModal').style.display = 'block';
}

function editWord(catId, wordIndex) {
  const cat = state.categories.find(c => c.id === catId);
  if (!cat || !cat.words[wordIndex]) return;
  _editingWord = { catId, wordIndex };
  const w = cat.words[wordIndex];
  document.getElementById('wordModalTitle').textContent = '✏️ 編輯詞彙';
  document.getElementById('wm_char').value = w.char || '';
  document.getElementById('wm_pinyin').value = w.pinyin || '';
  document.getElementById('wm_meaning').value = w.meaning || '';
  document.getElementById('wm_target').value = w.target || '';
  document.getElementById('wm_image').value = w.image || '';
  document.getElementById('wordModal').style.display = 'block';
}

function saveWordFromModal() {
  if (!_editingWord) return;
  const charVal = document.getElementById('wm_char').value.trim();
  if (!charVal) {
    alert('請填寫字符');
    return;
  }
  const cat = state.categories.find(c => c.id === _editingWord.catId);
  if (!cat) return;
  const newWord = {
    char: charVal,
    pinyin: document.getElementById('wm_pinyin').value.trim(),
    meaning: document.getElementById('wm_meaning').value.trim(),
    target: document.getElementById('wm_target').value.trim() || charVal,
    image: document.getElementById('wm_image').value.trim()
  };
  if (_editingWord.wordIndex === -1) {
    cat.words.push(newWord);
  } else {
    cat.words[_editingWord.wordIndex] = newWord;
  }
  closeWordModal();
  _persistCategories();
  renderEditCategoryList();
  renderAdminCategoryList();
  _rebuildWords();
  showToast('✅ 詞彙已儲存');
}

function closeWordModal() {
  document.getElementById('wordModal').style.display = 'none';
  _editingWord = null;
}

function deleteWord(catId, wordIndex) {
  const cat = state.categories.find(c => c.id === catId);
  if (!cat || !cat.words[wordIndex]) return;
  const w = cat.words[wordIndex];
  showConfirm(`確定刪除詞彙「${w.char}」？`, () => {
    cat.words.splice(wordIndex, 1);
    _persistCategories();
    renderEditCategoryList();
    renderAdminCategoryList();
    _rebuildWords();
    showToast('🗑 詞彙已刪除');
  });
}

// ---- Category CRUD ----
function addNewCategory() {
  const label = prompt('新分類名稱（例：食物、顏色、交通工具）');
  if (!label) return;
  const id = label.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, '') || ('cat_' + Date.now());
  const description = prompt('分類描述（可選）') || '';
  if (state.categories.find(c => c.id === id)) {
    alert('此 ID 已存在，請用另一個名稱');
    return;
  }
  state.categories.push({ id, label, description, enabled: true, words: [] });
  _persistCategories();
  renderEditCategoryList();
  renderAdminCategoryList();
  _rebuildWords();
  showToast('✅ 新分類已新增');
}

function editCategory(catId) {
  const cat = state.categories.find(c => c.id === catId);
  if (!cat) return;
  const newLabel = prompt('分類名稱', cat.label);
  if (newLabel === null) return;
  if (newLabel.trim()) cat.label = newLabel.trim();
  const newDesc = prompt('分類描述', cat.description || '');
  if (newDesc !== null) cat.description = newDesc.trim();
  _persistCategories();
  renderEditCategoryList();
  renderAdminCategoryList();
  _rebuildWords();
  showToast('✅ 分類已更新');
}

function deleteCategory(catId) {
  const cat = state.categories.find(c => c.id === catId);
  if (!cat) return;
  const wordCount = cat.words ? cat.words.length : 0;
  showConfirm(`確定刪除分類「${cat.label}」及其 ${wordCount} 個詞彙？此操作無法復原。`, () => {
    state.categories = state.categories.filter(c => c.id !== catId);
    _persistCategories();
    renderEditCategoryList();
    renderAdminCategoryList();
    _rebuildWords();
    showToast('🗑 分類已刪除');
  });
}

// ---- Confirm modal ----
function showConfirm(msg, onYes) {
  document.getElementById('confirmMsg').textContent = msg;
  _confirmCallback = onYes;
  document.getElementById('confirmModal').style.display = 'block';
}
function closeConfirmModal() {
  document.getElementById('confirmModal').style.display = 'none';
  _confirmCallback = null;
}
document.getElementById('confirmYes').addEventListener('click', () => {
  if (_confirmCallback) _confirmCallback();
  closeConfirmModal();
});

// ================== IMPORT / EXPORT ==================
function exportWordsJson() {
  const data = {
    _comment: '粵語朗讀評分 — 詞彙資料庫',
    _exported_at: new Date().toISOString(),
    categories: state.categories
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'words_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('⬇️ 已下載 JSON');
}

function importWordsJson(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.categories || !Array.isArray(data.categories)) {
        throw new Error('JSON 格式錯誤：缺少 categories 陣列');
      }
      showConfirm(`將匯入 ${data.categories.length} 個分類（${data.categories.reduce((s,c)=>s+(c.words||[]).length,0)} 個詞彙）。現有資料會被取代，確定？`, () => {
        state.categories = data.categories;
        // Preserve existing enabled states where possible
        const oldEnabled = {};
        JSON.parse(localStorage.getItem('yueAdminSettings') || '{}');
        state.categories.forEach(cat => {
          cat.enabled = cat.enabled !== false; // default true on import
        });
        _persistCategories();
        renderEditCategoryList();
        renderAdminCategoryList();
        _rebuildWords();
        showToast('⬆️ 匯入成功！');
      });
    } catch(err) {
      alert('匯入失敗：' + err.message);
    }
    event.target.value = ''; // allow re-import same file
  };
  reader.readAsText(file);
}

function resetToDefaultJson() {
  showConfirm('重設後將清除所有自訂詞彙，回到 data/words.json 預設內容。確定？', async () => {
    try {
      const resp = await fetch('data/words.json');
      const data = await resp.json();
      state.categories = data.categories || [];
      localStorage.removeItem('yueCategories');
      localStorage.removeItem('yueAdminSettings');
      renderEditCategoryList();
      renderAdminCategoryList();
      _rebuildWords();
      showToast('🔄 已重設為預設值');
    } catch(e) {
      alert('重設失敗：' + e.message);
    }
  });
}

// ================== PERSIST ==================
function _persistCategories() {
  localStorage.setItem('yueCategories', JSON.stringify(state.categories));
  // Also refresh enabled state to admin settings
  const overrides = {};
  state.categories.forEach(cat => { overrides[cat.id] = cat.enabled; });
  localStorage.setItem('yueAdminSettings', JSON.stringify(overrides));
}

init();
</script>
